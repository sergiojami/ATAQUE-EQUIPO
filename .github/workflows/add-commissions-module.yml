name: Add commissions module

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-commissions-module.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          s = s.replace('const titles={inicio:"Inicio",cuadrantes:"Cuadrante de Turnos",especiales:"Especiales",empleados:"Gestión de Empleados",novedades:"Novedades"};','const titles={inicio:"Inicio",cuadrantes:"Cuadrante de Turnos",especiales:"Especiales",comisiones:"Comisiones de Servicio / Ejercicios / Misiones",empleados:"Gestión de Empleados",novedades:"Novedades"};',1)
          old_nav='${navItem("inicio","⌂","Inicio",page)}${navItem("cuadrantes","▦","Cuadrante de Turnos",page)}${navItem("especiales","★","Especiales",page)}${admin?navItem("empleados","♟","Gestión de Empleados",page):""}${navItem("novedades","✦","Novedades",page)}'
          new_nav='${navItem("inicio","⌂","Inicio",page)}${navItem("cuadrantes","▦","Cuadrante de Turnos",page)}${navItem("especiales","★","Especiales",page)}${navItem("comisiones","✈","Comisiones de Servicio / Ejercicios / Misiones",page)}${admin?navItem("empleados","♟","Gestión de Empleados",page):""}${navItem("novedades","✦","Novedades",page)}'
          s=s.replace(old_nav,new_nav,1)
          s=s.replace('const pages={inicio,cuadrantes,especiales,empleados:empleadosPage,novedades};','const pages={inicio,cuadrantes,especiales,comisiones:comisionesPage,empleados:empleadosPage,novedades};',1)
          if 'async function comisionesPage(){' not in s:
              fn='''async function comisionesPage(){
  const r=await db.from("comisiones_servicio").select("id,ejercicio,fecha,lugar,created_at,updated_at").order("fecha",{ascending:false}).order("ejercicio");
  if(r.error){content.innerHTML=`<div class="panel error-state"><h3>No se pudieron cargar las comisiones</h3><p>${esc(r.error.message)}</p></div>`;return;}
  const rows=r.data||[]; window.__comisionesCache=rows;
  content.innerHTML=`<div class="calendar-toolbar"><div><span class="eyebrow">ACTIVIDAD OPERATIVA</span><h3>Comisiones de Servicio / Ejercicios / Misiones</h3><p class="muted">Registro centralizado de ejercicios, fechas y lugares. ${admin?"Solo el administrador puede añadir, editar o eliminar registros.":"Modo consulta."}</p></div>${admin?`<button class="btn primary" onclick="comisionForm()">+ Añadir registro</button>`:""}</div><div class="panel commission-panel"><div class="commission-summary"><div><span class="summary-label">REGISTROS</span><strong>${rows.length}</strong></div><div><span class="summary-label">ÚLTIMA FECHA</span><strong>${rows.length?new Date(rows[0].fecha+'T00:00:00').toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"}):"—"}</strong></div><div class="summary-note">${admin?"Puedes mantener actualizado el calendario operativo desde este apartado.":"La información está disponible para todo el equipo."}</div></div><div class="table-scroll"><table class="commission-table"><thead><tr><th>Ejercicio / Misión</th><th>Fecha</th><th>Lugar</th>${admin?`<th>Acciones</th>`:""}</tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><strong>${esc(x.ejercicio)}</strong></td><td><span class="date-chip">${new Date(x.fecha+'T00:00:00').toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}</span></td><td>${esc(x.lugar)}</td>${admin?`<td><button class="table-action" onclick="comisionForm('${x.id}')">✎ Editar</button><button class="table-action danger" onclick="deleteComision('${x.id}')">🗑 Eliminar</button></td>`:""}</tr>`).join(""):`<tr><td colspan="${admin?4:3}"><div class="empty-state compact"><div>✈</div><h3>No hay registros todavía</h3><p>${admin?"Añade el primer ejercicio, fecha y lugar.":"Todavía no hay actividades registradas."}</p></div></td></tr>`}</tbody></table></div></div>`;
}
function comisionForm(id=""){
  if(!admin)return;
  const existing=window.__comisionesCache?.find(x=>x.id===id)||{ejercicio:"",fecha:"",lugar:""};
  openModal(`<div class="modal-head"><div><span class="eyebrow">ACTIVIDAD OPERATIVA</span><h3>${id?"Editar registro":"Nuevo registro"}</h3></div><button class="icon-btn" onclick="closeModal()">×</button></div><label>Ejercicio / misión<input id="comEjercicio" class="field" value="${esc(existing.ejercicio)}" placeholder="Ej. Ejercicio Ala 11"></label><label>Fecha<input id="comFecha" class="field" type="date" value="${esc(existing.fecha||"")}"></label><label>Lugar<input id="comLugar" class="field" value="${esc(existing.lugar)}" placeholder="Lugar / base / localidad"></label><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveComision('${id}')">Guardar</button></div>`);
}
async function saveComision(id){
  if(!admin)return;
  const ejercicio=document.getElementById("comEjercicio")?.value.trim(); const fecha=document.getElementById("comFecha")?.value; const lugar=document.getElementById("comLugar")?.value.trim();
  if(!ejercicio||!fecha||!lugar){toast("Completa ejercicio, fecha y lugar","warn");return;}
  const payload={ejercicio,fecha,lugar,updated_at:new Date().toISOString()};
  const r=id?await db.from("comisiones_servicio").update(payload).eq("id",id):await db.from("comisiones_servicio").insert({ejercicio,fecha,lugar});
  if(r.error){toast(r.error.message,"error");return;}
  closeModal(); window.__comisionesCache=null; comisionesPage(); toast(id?"Registro actualizado":"Registro añadido");
}
async function deleteComision(id){
  if(!admin)return;
  const row=window.__comisionesCache?.find(x=>x.id===id); if(!row||!confirm(`¿Eliminar el registro "${row.ejercicio}"?`))return;
  const r=await db.from("comisiones_servicio").delete().eq("id",id); if(r.error){toast(r.error.message,"error");return;}
  comisionesPage(); toast("Registro eliminado");
}

'''
              s=s.replace('async function novedades(){',fn+'async function novedades(){',1)
          help_old='<p><b>Empleados:</b> el administrador puede incorporar o quitar personal desde Gestión de Empleados.</p>'
          help_new=help_old+'<p><b>Comisiones de Servicio / Ejercicios / Misiones:</b> permite registrar ejercicio o misión, fecha y lugar. El administrador puede mantener estos registros.</p>'
          if help_old in s and 'permite registrar ejercicio o misión, fecha y lugar' not in s:
              s=s.replace(help_old,help_new,1)
          app.write_text(s,encoding='utf-8')
          css=Path('styles.css')
          c=css.read_text(encoding='utf-8')
          if '/* Comisiones de servicio */' not in c:
              c+='''\n\n/* Comisiones de servicio */\n.commission-panel{padding:0;overflow:hidden}.commission-summary{display:grid;grid-template-columns:150px 190px 1fr;gap:0;border-bottom:1px solid #e1e8ef;background:linear-gradient(90deg,#f7fafc,#fff)}.commission-summary>div{padding:16px 18px;border-right:1px solid #e5ebf0}.commission-summary>div:last-child{border-right:0}.summary-label{display:block;color:#7a899a;font-size:9px;font-weight:800;letter-spacing:1.1px}.commission-summary strong{display:block;color:#173f63;font-size:22px;margin-top:5px}.summary-note{align-self:center;color:#6e7f92;font-size:11px;line-height:1.5}.commission-table{width:100%;border-collapse:collapse;min-width:720px}.commission-table th,.commission-table td{border-bottom:1px solid #e5ebf0;padding:13px 15px;text-align:left}.commission-table thead th{background:#173f63;color:#fff;font-size:11px;font-weight:800}.commission-table tbody tr:hover{background:#f8fbfd}.commission-table td{font-size:12px;color:#43566b}.commission-table td strong{color:#173451;font-size:13px}.date-chip{display:inline-flex;padding:5px 8px;border-radius:7px;background:#edf6fa;color:#1a6d8e;font-weight:800;font-size:10px;text-transform:capitalize}.commission-table .table-action{margin-right:5px}.empty-state.compact{padding:28px 10px}.empty-state.compact h3{margin:7px 0 4px}.empty-state.compact p{margin:0;color:#7a899a;font-size:11px}\n@media(max-width:900px){.commission-summary{grid-template-columns:1fr 1fr}.summary-note{grid-column:1/-1;border-top:1px solid #e5ebf0;border-right:0}.commission-table{min-width:650px}}\n'''
              css.write_text(c,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css
          git commit -m "auto: commissions module"
          git push
